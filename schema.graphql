# ShelterTask
############################

enum ShelterTaskType { CLEANING DEEP_CLEANING FEEDING MEDICATION GROOMING OTHER }
enum TaskStatus { PENDING IN_PROGRESS COMPLETED SKIPPED }
enum RecurrenceFreq { DAILY WEEKLY MONTHLY }
enum Weekday { MON TUE WED THU FRI SAT SUN }

# config ricorrenza (es: ogni settimana il sabato; ogni mese il primo mercoledì)
type Recurrence {
    freq: RecurrenceFreq!
    interval: Int!            # ogni N (giorni/settimane/mesi)
    weekdays: [Weekday!]      # WEEKLY: giorni; MONTHLY: giorno-settimana target
    week_ordinal: Int         # MONTHLY: 1..5 = primo..quinto, -1 = ultimo
    time_of_day: String       # "HH:MM"
    start_at: String          # data inizio (ISO)
}

input RecurrenceInput {
    freq: RecurrenceFreq!
    interval: Int = 1
    weekdays: [Weekday!]
    week_ordinal: Int
    time_of_day: String
    start_at: String
}

type ShelterTask {
    id: ID!
    created_at: String!
    shelter: Shelter!
    shelter_pet: ShelterPet
    task_type: ShelterTaskType!
    area: String
    status: TaskStatus!
    assigned_to: User
    scheduled_at: String
    completed_at: String
    completed_by: User
    is_recurring: Boolean!
    recurrence: Recurrence
    notes: String
}

type ShelterTaskResult {
    success: Boolean!
    error: Error
    shelter_task: ShelterTask
}

type PaginatedShelterTasks {
    success: Boolean
    error: Error
    items: [ShelterTask]!
    pagination: Pagination!
}

input ShelterTaskCreate {
    shelter_id: ID!
    shelter_pet_id: ID
    shelter_box_id: ID
    task_type: ShelterTaskType!
    area: String
    assigned_to_id: ID
    scheduled_at: String
    is_recurring: Boolean = false
    recurrence: RecurrenceInput
    notes: String
}

input ShelterTaskUpdate {
    task_type: ShelterTaskType
    area: String
    assigned_to_id: ID
    scheduled_at: String
    is_recurring: Boolean
    recurrence: RecurrenceInput
    notes: String
}

