# Pet
############################

enum CoatLength {
    SHORT
    MEDIUM
    LONG
    HAIRLESS
}

enum Gender {
    MALE
    FEMALE
    NOT_SAID
}

enum PetFamily {
    REPTILE
    CANINE
    FELINE
    BIRDS
    FISH
}

type Pet {
    id: ID!
    name: String!
    ownerships(commonSearch: CommonSearch = {}): PaginatedOwnerships
    birthday: String
    neutered: Boolean
    gender: Gender
    health_card: HealthCard
    chip_code: String
    weight_kg: Float
    temperament: String
    coat_length: CoatLength
    breed: String
    years: Int
    diet: [String]
    intollerance: [String]
    disciplines: [String]
    main_picture: Media
    pictures(commonSearch: CommonSearch = {}): PaginatedMedias
    report: Report
}

type PetResult {
    success: Boolean!
    error: Error
    pet: Pet
}

type PetsResult {
    success: Boolean!
    error: Error
    pets: [Pet]!
}

type PaginatedPets {
    success: Boolean!
    error: Error
    items: [Pet]!
    pagination: Pagination!
}

type PetAddedResult {
    success: Boolean!
    error: Error
    data: NewOwnership
}

type NewOwnership {
    pet: Pet!
    ownership: Ownership!
}

input PetCreate {
    name: String!
    birthday: String
    neutered: Boolean
    gender: Gender
    chip_code: String
    weight_kg: Float
    breed: String
    coat_length: CoatLength
    temperament: String
    diet: [String]
    intollerance: [String]
    disciplines: [String]
}

input PetUpdate {
    name: String
    birthday: String
    neutered: Boolean
    gender: Gender
    chip_code: String
    weight_kg: Float
    temperament: String
    breed: String
    coat_length: CoatLength
    diet: [String]
    intollerance: [String]
    disciplines: [String]
}


