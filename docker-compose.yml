version: '3.1'
services:
    server:
        build: ./
        # command: "python3 -m gunicorn --workers 4 --bind 0.0.0.0:5000 app:app"
        ports:
            - 5000:5000
        depends_on:            
            - redis
        volumes:
            - .:/app
        environment:
            - FLASK_APP=app.py
            - FLASK_ENV=development
        networks:
            - gap-network            
            - shared-network
    redis:
        image: redis:latest
        ports:
            - "6379:6379"
        networks:
            - gap-network
    
volumes:
  postgres_data:

networks:
    gap-network: